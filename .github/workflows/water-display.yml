name: Okti display-frame capture
on:
  push:
    branches: ['work/probe-water-33-342']
permissions:
  contents: read
jobs:
  record:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: actions/checkout@v4
        with:
          ref: d8e3ab10557d65a71fa9098975dd29eb4fac56b2
          path: prior
      - run: APP_ROOT=prior node tests/optical-reference.cjs
      - run: node tests/optical-reference.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: water-display
          path: proof/
          retention-days: 3
