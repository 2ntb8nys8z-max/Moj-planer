name: Public iPhone WebKit pressure check
on:
  push:
    branches: ['work/public-pressure-343*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: node tests/pressure-public-check.cjs
        env:
          PUBLIC_URL: https://2ntb8nys8z-max.github.io/Moj-planer/podglad-nacisku/?build=80111555789c1293
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-water
          path: capture/
