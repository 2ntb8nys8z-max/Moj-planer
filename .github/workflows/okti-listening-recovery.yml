name: Okti listening recovery
on:
  push:
    branches: [main, 'work/okti-listening-*', 'work/okti-bubble-press-*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: okti-listening-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --ipc=host
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check:generated
      - name: Verify elastic bubble feedback
        env:
          PLANNER_BROWSER: ${{ matrix.browser }}
        run: node tests/octi-pressure-browser-33.cjs
      - name: Verify historical artwork fidelity and recovery with actual browser pixels
        env:
          PLANNER_BROWSER: ${{ matrix.browser }}
        run: node tests/octi-listening-history-browser-33.cjs && node tests/octi-listening-recovery-browser-33.cjs && node tests/event-note-octopus-browser-33.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: okti-listening-${{ matrix.browser }}
          path: test-results/okti-listening/
          retention-days: 7
  controls:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --ipc=host
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check:generated
      - name: Verify the existing recorder, artwork and action controls
        run: node tests/octi-motion-browser-33.cjs
      - name: Verify the existing listening fixture
        if: success() || failure()
        run: node tests/octi-listening-browser-33.cjs
      - name: Verify journal and shopping controls
        if: success() || failure()
        run: npm run test:journal-browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: okti-listening-controls
          path: test-output/
          retention-days: 7
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Run complete application regression suite
        env:
          TZ: Europe/Warsaw
        run: npm test
