name: Okti listening recovery
on:
  push:
    branches: [main, 'work/okti-listening-*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: okti-listening-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --ipc=host
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check:generated
      - name: Run complete application regression suite
        if: matrix.browser == 'chromium'
        env:
          TZ: Europe/Warsaw
        run: npm test
      - name: Verify the existing recorder, artwork and action controls
        if: matrix.browser == 'chromium'
        run: npm run test:logo-browser && npm run test:journal-browser
      - name: Verify head-only rendering and recovery with actual browser pixels
        env:
          PLANNER_BROWSER: ${{ matrix.browser }}
        run: node tests/octi-listening-recovery-browser-33.cjs && node tests/event-note-octopus-browser-33.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: okti-listening-${{ matrix.browser }}
          path: |
            test-results/okti-listening/
            test-output/cancel-bubble-*.png
          retention-days: 7
