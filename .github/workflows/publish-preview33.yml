name: Publish Preview33

on:
  push:
    branches: [integration/conversation33]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: preview33-publication
  cancel-in-progress: true

jobs:
  verify-and-publish:
    if: github.ref == 'refs/heads/integration/conversation33'
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - name: Check out canonical integration source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: integration

      - name: Use the supported Node runtime
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        working-directory: integration
        run: npm ci

      - name: Rebuild and verify canonical frontend artifacts
        working-directory: integration
        run: |
          npm run build
          git diff --exit-code

      - name: Verify generated files and tests
        working-directory: integration
        run: npm test

      - name: Select the runner browser for mobile journal checks
        working-directory: integration
        run: |
          planner_browser="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -n "$planner_browser" ]; then
            "$planner_browser" --version
            echo "PLANNER_CHROMIUM=$planner_browser" >> "$GITHUB_ENV"
          else
            timeout 180s npx playwright install --with-deps chromium
          fi

      - name: Verify mobile journal interactions and layout
        working-directory: integration
        run: npm run test:journal-browser

      - name: Stage publication artifacts
        run: |
          mkdir -p "$RUNNER_TEMP/preview33/fonts"
          cp integration/preview33/fonts/* "$RUNNER_TEMP/preview33/fonts/"
          cp integration/preview33/index.html "$RUNNER_TEMP/preview33/index.html"
          cp integration/preview33/release.json "$RUNNER_TEMP/preview33/release.json"
          cp integration/preview33/worker.txt "$RUNNER_TEMP/preview33/worker.txt"
          cp integration/preview33/google-calendar.js integration/preview33/sync-core.js integration/preview33/manifest.webmanifest integration/preview33/app-icon-180.png integration/preview33/app-icon-512.png integration/preview33/header-sky.webp integration/preview33/octi-water-glass.webp integration/preview33/octi-water-mascot.webp integration/preview33/shopping-paper-top.webp integration/preview33/shopping-paper-body.webp integration/preview33/shopping-paper-bottom.webp integration/preview33/shopping-update-button.webp integration/preview33/shopping-close-x-v2.webp integration/preview33/shopping-purchased-note-v3.webp "$RUNNER_TEMP/preview33/"

      - name: Check out GitHub Pages branch
        uses: actions/checkout@v4
        with:
          ref: main
          path: pages

      - name: Publish only Preview33 artifacts
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          mkdir -p pages/preview33/fonts
          cp "$RUNNER_TEMP/preview33/fonts/"* pages/preview33/fonts/
          cp "$RUNNER_TEMP/preview33/index.html" pages/preview33/index.html
          cp "$RUNNER_TEMP/preview33/release.json" pages/preview33/release.json
          cp "$RUNNER_TEMP/preview33/worker.txt" pages/preview33/worker.txt
          cp "$RUNNER_TEMP/preview33/google-calendar.js" "$RUNNER_TEMP/preview33/sync-core.js" "$RUNNER_TEMP/preview33/manifest.webmanifest" "$RUNNER_TEMP/preview33/app-icon-180.png" "$RUNNER_TEMP/preview33/app-icon-512.png" "$RUNNER_TEMP/preview33/header-sky.webp" "$RUNNER_TEMP/preview33/octi-water-glass.webp" "$RUNNER_TEMP/preview33/octi-water-mascot.webp" "$RUNNER_TEMP/preview33/shopping-paper-top.webp" "$RUNNER_TEMP/preview33/shopping-paper-body.webp" "$RUNNER_TEMP/preview33/shopping-paper-bottom.webp" "$RUNNER_TEMP/preview33/shopping-update-button.webp" "$RUNNER_TEMP/preview33/shopping-close-x-v2.webp" "$RUNNER_TEMP/preview33/shopping-purchased-note-v3.webp" pages/preview33/
          rm -f pages/preview33/shopping-top-tape-v2.webp pages/preview33/shopping-pencil.webp
          cd pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u preview33
          git add preview33/fonts preview33/index.html preview33/release.json preview33/worker.txt preview33/google-calendar.js preview33/sync-core.js preview33/manifest.webmanifest preview33/app-icon-180.png preview33/app-icon-512.png preview33/header-sky.webp preview33/octi-water-glass.webp preview33/octi-water-mascot.webp preview33/shopping-paper-top.webp preview33/shopping-paper-body.webp preview33/shopping-paper-bottom.webp preview33/shopping-update-button.webp preview33/shopping-close-x-v2.webp preview33/shopping-purchased-note-v3.webp
          if git diff --cached --quiet; then
            echo "Preview33 is already current."
            exit 0
          fi
          git commit -m "Publish Preview33 from ${SOURCE_SHA} [skip ci]"
          git push origin HEAD:main

      # A push with GITHUB_TOKEN does not itself start the branch-based Pages build.
      - name: Request the GitHub Pages build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${{ github.repository }}/pages/builds"

      - name: Verify the files actually served by Preview33
        working-directory: integration
        run: node scripts/verify-preview33.mjs https://2ntb8nys8z-max.github.io/Moj-planer/preview33/
