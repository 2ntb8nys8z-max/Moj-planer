name: Okti display-frame capture
on:
  push:
    branches: ['work/probe-water-33-333']
permissions:
  contents: read
jobs:
  record:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node tests/water-display-capture.cjs
        env:
          PLANNER_PRESSURE_VIDEO: '1'
      - run: node tests/octi-listening-history-browser-33.cjs
        env:
          PLANNER_BROWSER: webkit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: water-display
          path: test-results/okti-listening/*.webm
          retention-days: 3
