name: Verify Okti motion

on:
  push:
    branches: [work/okti-loop-33-137]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: UTC
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - name: Verify the checked-in release and application regressions
        run: |
          npm run build
          git diff --exit-code
          npm test
      - name: Select the runner browser
        run: |
          planner_browser="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -n "$planner_browser" ]; then
            echo "PLANNER_CHROMIUM=$planner_browser" >> "$GITHUB_ENV"
          else
            timeout 180s npx playwright install --with-deps chromium
          fi
      - name: Verify decoded logo loop, mobile layout and shopping animation
        run: |
          npm run test:logo-browser
          npm run test:journal-browser
