name: Speech button browser regression
on:
  push:
    branches: [main, 'work/speech-*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: speech-button-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --ipc=host
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify native speech activation and existing hour choices
        env:
          TZ: Europe/Warsaw
          PLANNER_BROWSER: ${{ matrix.browser }}
        run: node tests/speech-button-browser-33.cjs && node tests/hour-choice-browser-33.cjs
      - name: Wait for the tested production HTML
        if: github.ref == 'refs/heads/main'
        run: node scripts/verify-event-hero-deployment.mjs
      - name: Verify the published speech button
        if: github.ref == 'refs/heads/main'
        env:
          TZ: Europe/Warsaw
          PLANNER_BROWSER: ${{ matrix.browser }}
          PLANNER_LIVE_URL: https://2ntb8nys8z-max.github.io/Moj-planer/
        run: node tests/speech-button-browser-33.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: speech-button-${{ matrix.browser }}
          path: test-results/
          retention-days: 7
