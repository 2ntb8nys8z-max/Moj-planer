name: Verify Okti motion 33.136
on:
  push:
    branches: [fix/okti-motion-33-136]
permissions:
  contents: read
jobs:
  render-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - name: Prepare graphics tools
        run: |
          if ! command -v ffmpeg; then sudo apt-get update -qq && sudo apt-get install -y ffmpeg; fi
          planner_browser="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -n "$planner_browser" ]; then echo "PLANNER_CHROMIUM=$planner_browser" >> "$GITHUB_ENV"; else npx playwright install --with-deps chromium; fi
      - name: Render continuous tentacle animation
        run: npm run render:logo
      - name: Build and test the exact release
        run: |
          npm run build
          npm test
          npm run test:logo-browser
          npm run test:journal-browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: okti-motion-33-136
          path: |
            octi-water-motion*
            index.html
            release.json
            preview33
          retention-days: 7
