name: Event header visual regression
on:
  push:
    branches: [main, 'work/event-hero-*']
  pull_request:
    paths: ['index.html', 'tests/event-hero-browser-33.cjs', '.github/workflows/event-hero-browser.yml']
permissions:
  contents: read
concurrency:
  group: event-hero-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Verify animated event header
        env:
          TZ: Europe/Warsaw
          PLANNER_BROWSER: ${{ matrix.browser }}
        run: node tests/event-hero-browser-33.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: event-hero-${{ matrix.browser }}
          path: test-results/
          retention-days: 14
