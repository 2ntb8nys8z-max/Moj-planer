<!doctype html><html lang="pl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Księga Yagi — przegląd redakcyjny Okti</title>
<style>body{font:17px/1.6 system-ui,sans-serif;background:#f4f7fa;color:#182e3c;max-width:1000px;margin:auto;padding:24px}h1{font-size:28px;color:#07539b}h2{font-size:22px}button,input,select{font:inherit;max-width:100%;padding:10px;border:1px solid #8297aa;border-radius:7px;background:white;color:#182e3c}label{display:inline-block;margin:8px 15px 8px 0}article{background:white;padding:20px;margin:18px 0;border:1px solid #b6c9d9;border-radius:12px;overflow-wrap:anywhere}blockquote{margin:10px 0;padding:10px 15px;border-left:4px solid #8a5909;background:#fcf7ec;white-space:pre-line}summary{cursor:pointer;font-weight:650}small{color:#405969}code{font-size:14px}a{color:#07539b}</style>
<h1>Księga Yagi — przegląd redakcyjny</h1><p>Autorka: Zofia Rende. To wykaz źródeł, konfliktów i kandydatów do redakcji. Status „do przeglądu” oznacza, że fragment nie jest samodzielną wskazówką w głównym widoku Okti. Oryginalne teksty pozostają w rozwinięciu Księgi.</p><p id="stats"></p><label>Data <input id="date" type="date" min="2026-11-01" max="2027-12-31"></label><label>Zakres <select id="scope"><option value="review">Do przeglądu</option><option value="conflicts">Konflikty i rozbieżności</option><option value="all">Wszystkie wskazówki</option></select></label><button id="download">Pobierz dane z dowodami (JSON)</button><div id="list" aria-live="polite"></div>
<script src="day-briefing.js"></script><script src="brief-inspiration-data.js"></script><script src="brief-guidance-data.js"></script><script src="brief-guidance.js"></script><script src="brief-inspiration.js"></script>
<script>
const days=OktiInspirationData.days.map(r=>OktiDayInspiration.day(r[0])),all=days.flatMap(d=>d.guidance),held=all.filter(g=>g.review.status!=='approved'),issues=days.flatMap(d=>d.sourceIssues),conflicts=days.flatMap(d=>d.guidanceConflicts),el=id=>document.getElementById(id),node=(tag,text)=>{const n=document.createElement(tag);n.textContent=text;return n};
el('stats').textContent=days.length+' dat · '+all.length+' wskazówek/kandydatów · '+held.length+' do przeglądu · '+conflicts.length+' konfliktów · '+issues.length+' rozbieżności godzin. Fragmenty do przeglądu obejmują także symbolikę, rytuały, zależne cytaty i treści zielarskie; nie są listą błędów.';
function render(){el('list').replaceChildren();const date=el('date').value,scope=el('scope').value;for(const day of days){if(date&&day.date!==date)continue;let values=scope==='conflicts'?[...day.guidanceConflicts,...day.sourceIssues]:scope==='all'?day.guidance:day.guidanceReview;if(!values.length)continue;const section=node('section','');section.append(node('h2',day.date));for(const value of values){const a=node('article','');a.append(node('strong',value.text||value.reason));a.append(node('p',value.review?.reason||value.reason||'Wskazówka wybrana ze źródła.'));a.append(node('small',(value.kind==='favor'?'Sprzyja':value.kind==='attention'?'Zwróć uwagę':value.kind)+' · '+(value.review?.status||value.status)+' · '+(value.transformation||'dwa źródła')));if(value.validity?.originalText)a.append(node('p','Okres/warunek: '+value.validity.originalText));for(const e of value.evidence||[]){const d=node('details','');d.append(node('summary',e.sheet+' · '+e.cell+' · '+e.date));d.append(node('blockquote',e.quote));d.append(node('small',e.fileName+' · SHA-256 '+e.fileSha256));a.append(d)}section.append(a)}el('list').append(section)}}
el('date').onchange=render;el('scope').onchange=render;el('download').onclick=()=>{const blob=new Blob([JSON.stringify({schemaVersion:2,sourceFile:days[0].sourceFile,counts:{dates:days.length,candidates:all.length,held:held.length},days:days.map(d=>({date:d.date,metadata:d.sourceMetadata,guidance:d.guidance,conflicts:d.guidanceConflicts,sourceIssues:d.sourceIssues,coverage:d.guidanceCoverage}))},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='Okti-Ksiega-Yagi-wskazowki-i-przeglad.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};render();
</script></html>
