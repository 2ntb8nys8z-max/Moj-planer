<script>

  if(!event.isPrimary||event.button!==0)return;
  ignoreDragClick=false;

  soundsSwitch.setPointerCapture(event.pointerId);

  if(drag?.id!==event.pointerId)return;
  const dx=event.clientX-drag.x;

  soundsSwitch.classList.add('is-dragging');

function finishDrag(event){
  if(drag?.id!==event.pointerId)return;
  const dx=event.clientX-drag.x;
  if(event.type==='pointerup'&&(Math.abs(dx)>=5||soundsSwitch.classList.contains('is-dragging'))){

  soundsSwitch.classList.remove('is-dragging');

// BEGIN GUEST TOSS
const shoppingPaperEase=t=>{t=Math.max(0,Math.min(1,t));return t*t*(3-2*t)};
const shoppingTossDuration=850;
const shoppingPaperGrid={cols:48,rows:28};
function shoppingPaperMesh(snapshot,progress,closing,anchor){
  const {width:w,height:h,left,top,pad=24}=snapshot;
  const W=w-2*pad,H=h-2*pad,points=[];
  const {cols,rows}=snapshot.fallback?{cols:24,rows:12}:shoppingPaperGrid;
  const center=snapshot.center||{x:left+w/2,y:top+h/2};
  const t=progress*shoppingTossDuration/1000;
  const flight=Math.max(0,1-t/.46)**2;
  // The wrist lifts the close corner around a pivot beside the lower left edge.
  const travel=Math.max(0,(progress-.23)/.77);
  const lift=shoppingPaperEase(progress/.29);
  const turn=(5.8*shoppingPaperEase(progress/.46)+2*shoppingPaperEase((progress-.375)/.58))*Math.PI/180;
  const pivotX=-.475*W,pivotY=.469*H;
  const pivotShiftX=pivotX*(1-Math.cos(turn))+pivotY*Math.sin(turn);
  const pivotShiftY=pivotY*(1-Math.cos(turn))-pivotX*Math.sin(turn);
  const cx=closing?center.x+pivotShiftX+(innerWidth-center.x+w*.58)*travel**1.65:center.x-(center.x+w*.52)*flight;
  const cy=closing?center.y+pivotShiftY-.06*W*travel:center.y+W*.2575*flight;
  const angle=(snapshot.angle??(-.35*Math.PI/180))+(closing?turn:-7.2*flight*Math.PI/180);
  const scale=1,cos=Math.cos(angle),sin=Math.sin(angle);
  const ripple=shoppingPaperEase((progress-.27)/.19)*(1-shoppingPaperEase((progress-.71)/.29));
  for(let col=0;col<=cols;col++){
    const u=col/cols;
    for(let row=0;row<=rows;row++){
      const v=row/rows;
      let x=(u-.5)*w,y=(v-.5)*h,z=0,light=1;
      if(closing){
        const across=.5+x/W,down=.5+y/H;
        const corner=Math.max(0,Math.min(1,(across-.56*down-.46)/.54));
        const bend=1.62*lift*corner;
        if(lift>.00001){
          const radius=.54*W/(1.62*lift);
          x-=radius*(bend-Math.sin(bend));
          z=radius*(1-Math.cos(bend));
        }
        const wavePosition=(across+.27*down-1.08+1.176*progress)/.26;
        z+=.07*W*ripple*Math.exp(-(wavePosition**2));
        light+=.07*Math.sin(2*bend)-.075*(1-Math.cos(bend));
      }else{
        const vertical=Math.max(0,Math.min(1,(v*h-pad)/H));
        const right=x>=0;
        const width=W*(right ? .25+.06*(1-vertical) : .29+.05*vertical);
        const distance=Math.max(0,Math.abs(x)-(W/2-width));
        const settle=Math.max(0,Math.min(1,(t-.19-.32*(1-vertical)**1.2)/.32));
        const trailing=Math.max(0,Math.min(1,(t-.12-.13*(1-vertical))/.46));

function drawShoppingPaperTriangle(ctx,texture,source,target){

    const changed=group.keys.map(key=>byKey.get(key)).find(row=>row&&row.done!==group.done);
    if(changed&&button.getClientRects().length)moves.push({button,changed});
  }
  if(!moves.length){show(data);return}
  busy=true;
  try{
    await Promise.all(moves.map(({button,changed})=>shoppingInk.draw(button,!changed.done)));
    for(const move of moves)move.start=shoppingInk.capture(move.button.querySelector('.item-name'),move.changed.text);
    if(moves.some(move=>move.changed.done))document.querySelector('details').open=true;
    show(data);
    const buttons=[...document.querySelectorAll('.item')];
    await Promise.all(moves.map(({changed,start})=>{
      const row=buttons.find(el=>el.shoppingGroup.keys.includes(changed.key));
      if(row)return shoppingInk.fly(start,row.querySelector('.item-name'),row,!changed.done);
    }));
  }finally{busy=false}
}
async function removeGuestProduct(key){
  if(busy||gated)return;
  busy=true;
  try{
    const data=await request('remove',{key});
    show(data);fitPurchased();$('status').textContent='Usunięto produkt.';
  }catch(error){$('status').textContent=error.message}
  finally{busy=false}
}
async function refresh(){
  if((gated&&!person.actor)||busy||reading)return;reading=true;
  try{
    const data=await request('read',{});
    if(busy)return;
    if(gated){
      if(typeof data.canAdd!=='boolean')return;
      revealInvitation(false);
    }
    $('status').textContent='';await showIncoming(data);
  }catch(e){
    if(e.status===403){if(!gated)await displayInvite()}
    else $('status').textContent=e.message;
  }finally{reading=false}
}
async function mark(group,button){
  if(busy||(group.done&&!group.canRestore))return;busy=true;
  const expected=revision;
  try{
    if(!person.nick){
      const dialog=$('identity');dialog.returnValue='';dialog.showModal();
      await new Promise(resolve=>dialog.addEventListener('close',resolve,{once:true}));
      if(dialog.returnValue!=='ok'||!$('nick').value.trim())return;
      person={actor:crypto.randomUUID(),nick:$('nick').value.trim()};
      try{localStorage.setItem(store,JSON.stringify(person))}catch{}
    }
    const ink=shoppingInk.draw(button,group.done);
    const data=await request('mark',{...person,keys:group.keys,done:!group.done,revision:expected});
    await ink;
    await moveProductName(button,group,data);
    $('status').textContent='';
  }catch(e){
    button.classList.remove('is-marking','is-unmarking');
    if(e.status===409){
      try{show(await request('read',{}));$('status').textContent='Lista zmieniła się w międzyczasie. Sprawdź produkt.'}
      catch(readError){$('status').textContent=readError.message}
    }
    else $('status').textContent=e.message;
  }finally{busy=false}
}
async function openSharedSheet(){
  const root=document.documentElement,loading=$('arrivalLoading');
  const notice=setTimeout(()=>{if(root.classList.contains('arrival-wait'))loading.hidden=false},400);
  try{
    await refresh();
    if(revision<0)return;
    if(document.fonts){
      await Promise.race([document.fonts.ready,new Promise(resolve=>setTimeout(resolve,600))]);
      document.fonts.ready.then(fitPurchased);
    }
    fitPurchased();
    clearTimeout(notice);loading.hidden=true;
    await arrive();
  }finally{clearTimeout(notice);loading.hidden=true;root.classList.remove('arrival-wait')}
}
async function displayInvite(){
  gated=true;revision=-1;
  document.documentElement.classList.remove('arrival-wait');
  document.querySelector('main').hidden=true;$('guestGate').hidden=false;
  $('pending').replaceChildren();$('bought').replaceChildren();$('listTitle').textContent='Do kupienia';
  document.title='Wspólna lista zakupów · Okti';
  const form=$('joinForm'),submit=form.querySelector('[type=submit]');
  productForm.hidden=true;resetProductEntry();
  form.hidden=!invite;submit.disabled=true;
  $('joinMessage').textContent=invite?'':'Poproś osobę, która udostępnia listę, o link do zakupów.';
  if(!invite)return;
  try{
    const info=await request('invite-info',{invite});
    form.hidden=!info.available;submit.disabled=!info.available;
    if(info.available){if(!$('joinNick').value)$('joinNick').value=person.nick||''}
    else $('joinMessage').textContent=info.used?'Wszystkie miejsca w tym zaproszeniu zostały już wykorzystane.':'To zaproszenie jest już nieaktywne. Poproś osobę, która je wysłała, o dostęp do listy.';
  }catch(e){form.hidden=true;$('joinMessage').textContent=e.status?e.message:'Nie udało się sprawdzić dostępu. Sprawdź połączenie i odśwież stronę.'}
}
function revealInvitation(playArrival=true){
  gated=false;$('guestGate').hidden=true;document.querySelector('main').hidden=false;
  if(playArrival&&!reducedMotion())document.documentElement.classList.add('arrival-wait');
}
$('joinForm').onsubmit=async event=>{
  event.preventDefault();
  const nick=$('joinNick').value.trim(),button=$('joinForm').querySelector('[type=submit]');
  if(busy||button.disabled||!nick)return;
  prepareArrivalSound();
  busy=true;button.disabled=true;
  try{
    const next={actor:person.actor||crypto.randomUUID(),nick};
    // Retain the browser credential before claiming a seat.
    localStorage.setItem(store,JSON.stringify(next));person=next;
    const data=await request('join',{invite,nick});
    revealInvitation();$('status').textContent='';show(data);
  }catch(e){
    if(e.status===403||e.status===409)await displayInvite();
    if(!$('joinForm').hidden)$('joinMessage').textContent=e.message||'Nie udało się dołączyć. Spróbuj ponownie.';
  }finally{busy=false;button.disabled=false}
  if(!gated)await openSharedSheet();
};
const productForm=$('addProductForm'),productInput=$('newProduct'),addButton=$('openAddProduct');
let pendingAddition=null;
function setProductEntry(open){
  productInput.hidden=!open;
  addButton.setAttribute('aria-expanded',String(open));
}
function resetProductEntry(){
  setProductEntry(false);
  productInput.value='';
  pendingAddition=null;
}
document.addEventListener('pointerdown',event=>{
  if(!productInput.hidden&&!productForm.contains(event.target))setProductEntry(false);
});
window.addEventListener('pagehide',()=>setProductEntry(false));
productInput.onkeydown=event=>{
  if(event.key==='Escape'){
    event.preventDefault();resetProductEntry();addButton.focus();
  }
};
productForm.onsubmit=async event=>{
  event.preventDefault();
  if(busy||gated||productForm.hidden)return;
  if(productInput.hidden){
    setProductEntry(true);productInput.focus();return;
  }
  const text=productInput.value.trim();
  if(!text){resetProductEntry();addButton.focus();return}
  if(!pendingAddition||pendingAddition.text!==text)pendingAddition={text,itemId:crypto.randomUUID()};
  busy=true;addButton.disabled=productInput.disabled=true;
  try{
    const data=await request('add',pendingAddition);
    resetProductEntry();show(data);fitPurchased();
    $('status').textContent='Dodano produkt.';
  }catch(e){
    if(e.status===403)await displayInvite();else $('status').textContent=e.message;
    return;
  }finally{busy=false;addButton.disabled=productInput.disabled=false}
  if(!productForm.hidden)addButton.focus({preventScroll:true});
};async function startGuest(){
  if(invite){
    if(!person.actor){await displayInvite();return}
    try{
      const data=await request('read',{});
      if(typeof data.canAdd!=='boolean'){await displayInvite();return}
      revealInvitation();$('status').textContent='';show(data);
    }catch{await displayInvite();return}
  }
  await openSharedSheet();
}
startGuest();setInterval(()=>{if(!document.hidden)refresh()},4000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh()});
</script></body></html>
