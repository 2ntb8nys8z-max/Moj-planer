<!doctype html><html lang="pl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Okti — kontrola animacji</title>
<style>
body{margin:0;background:#f7f8fc;font:15px system-ui;color:#172033}main{width:390px;max-width:100%;margin:20px auto;padding:20px;box-sizing:border-box}.octi-dock{--octi-size:100px;width:220px;height:210px;position:relative;margin:auto}.water-float{width:100px;height:100px;position:absolute;left:60px;top:35px}.idle{position:absolute;left:50%;top:50%;width:160%;height:160%;transform:translate(-50%,-50%);border-radius:50%;pointer-events:none}.octi-listening-media{position:absolute;left:50%;top:50%;width:128%;height:128%;transform:translate(-50%,-50%);overflow:clip;border-radius:50%;pointer-events:none;z-index:13;opacity:0;transition:opacity .16s ease;mask-image:radial-gradient(circle closest-side,#000 0 95%,transparent 100%)}.octi-listening-media.is-active{opacity:1}.octi-listening-canvas,.octi-listening-fallback{position:absolute;left:50%;top:50%;display:block;width:125%;height:125%;max-width:none;transform:translate(-50%,-50%);object-fit:contain;opacity:0;pointer-events:none}.is-rendered .octi-listening-canvas,.is-fallback .octi-listening-fallback{opacity:1}.octi-listening-source{position:absolute;width:1px;height:1px;opacity:0}.controls{display:flex;flex-wrap:wrap;gap:8px}button{padding:12px;border:1px solid #ccd7e8;border-radius:12px;background:white;color:#172033}output{display:block;white-space:pre-wrap;font:12px monospace;margin-top:15px}#caption{text-align:center}
</style>
<main><h1>Okti — test 128 px</h1><div class="octi-dock"><div class="water-float"><video class="idle" muted playsinline loop autoplay src="octi-water-motion.mp4"></video></div></div><p id="caption">Gotowa do nagrania</p><div class="controls"><button id="start">Rozpocznij słuchanie</button><button id="stop">Zakończ słuchanie</button><button id="quick">Szybki start i stop</button><button id="reduce">Ogranicz ruch</button><button id="context">Ukryj kontekst</button></div><output id="state" aria-live="off"></output></main>
<script src="octi-listening.js"></script><script>
const root=document.querySelector('.octi-dock'),floating=root.querySelector('.water-float'),idle=root.querySelector('.idle'),motion={matches:false};
const options={visible:true,isRecording:false,opening:false};const controller=createOctiListeningArtwork(root,floating,motion,idle);
document.querySelector('#start').onclick=()=>{options.isRecording=true;document.querySelector('#caption').textContent='Nagrywanie — Okti słucha';};
document.querySelector('#stop').onclick=()=>{options.isRecording=false;document.querySelector('#caption').textContent='Powrót po zakończeniu nagrywania';};
document.querySelector('#quick').onclick=()=>{options.isRecording=true;setTimeout(()=>options.isRecording=false,180);};
document.querySelector('#reduce').onclick=event=>{motion.matches=!motion.matches;event.target.textContent=motion.matches?'Włącz pełny ruch':'Ogranicz ruch';};
document.querySelector('#context').onclick=event=>{options.visible=!options.visible;event.target.textContent=options.visible?'Ukryj kontekst':'Pokaż kontekst';};
window.addEventListener('error',event=>document.querySelector('#caption').textContent=event.message);
setInterval(()=>{controller.update(options);document.querySelector('#state').textContent=JSON.stringify(controller.getState(),null,2)},100);
</script></html>
