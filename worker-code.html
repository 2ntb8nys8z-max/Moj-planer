<script>
const code=document.getElementById('code'),status=document.getElementById('status'),button=document.getElementById('copy');
fetch('worker.txt?v=20261008-33.10-test',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error();return r.text()}).then(text=>{if(!text.includes('2026.10.08.33.10-test'))throw Error();code.value=text;button.disabled=false;status.textContent='Gotowy do skopiowania. To kod wygenerowany z worker.js.'}).catch(()=>status.textContent='Nie udało się pobrać kodu. Odśwież stronę lub użyj linku do TXT.');
